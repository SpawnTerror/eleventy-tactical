// Practice config for Counter Strike 2
// https://spawnterror.com
// By HyperionTitan & SpawnTerror, October 15th, 2024

// --- Game Mode Settings ---
game_mode 0               // Set game mode to casual
exec gamemode_casual     // Execute casual game mode script
mp_restartgame 1          // Restart the game immediately

// --- Bot Settings ---
bot_kick                  // Kick all bots initially
bot_quota 2              // Set the desired number of bots (one bot in this case)
bot_stop 1                // Make the bots stand still
bot_dont_shoot 1          // Prevent bots from shooting
bot_chatter off           // Disable bot chatter
bot_mimic -2              // Disable bot mimicry
bot_place                 // Bind mouse4 to place a bot (useful for positioning)
bind i "toggle bot_crouch 0 1" // Bind "i" to toggle bot crouching

// --- Player Settings ---
sv_cheats 1               // Enable cheats
buddha                    // Enable buddha mode (god mode)
buddha_ignore_bots 1     // Prevent bots from damaging you in buddha mode
sv_regeneration_force_on 1 // Enable health regeneration
sv_regeneration_wait_time 0.5 // Set regeneration delay to 0.5 seconds
noclip                    // Enable noclip (binds for toggling are below)
bind mouse3 noclip       // Bind mouse3 (press scrollwheel) to toggle noclip

// --- Weapon Settings ---
sv_infinite_ammo 1       // Enable infinite ammo (with no reload), If you need a reload, use sv_infinite_ammo 2 
ammo_grenade_limit_total 5 // Allow a maximum of 5 grenades in total
ammo_grenade_limit_flashbang 1 // Limit flashbangs to 1
mp_t_default_primary weapon_ak47 // Set default T primary weapon to AK-47
mp_t_default_secondary weapon_deagle // Set default T secondary weapon to Deagle
mp_ct_default_primary weapon_m4a1 // Set default CT primary weapon to M4A1
mp_ct_default_secondary weapon_deagle // Set default CT secondary weapon to Deagle
mp_t_default_grenades "weapon_hegrenade weapon_smokegrenade weapon_flashbang weapon_molotov weapon_decoy" // Give Ts all grenades
mp_ct_default_grenades "weapon_hegrenade weapon_smokegrenade weapon_flashbang weapon_molotov weapon_decoy" // Give CTs all grenades
mp_weapons_allow_typecount -1 // Unlimited buys (no weapon type restrictions)
mp_drop_knife_enable 1   // Allow dropping the knife
mp_death_drop_gun 1      // Make players drop their weapon on death

// --- Grenade Settings ---
ff_damage_reduction_grenade_self 0  // Disable self-damage from grenades
bind mouse5 "sv_rethrow_last_grenade" // Bind mouse5 to rethrow the last grenade
sv_grenade_trajectory_prac_pipreview 1 // Show grenade trajectory preview

// --- Round Settings ---
mp_limitteams 0           // Remove team limits
mp_autoteambalance 0     // Disable auto team balance
mp_maxmoney 60000        // Set max money to $60000
mp_startmoney 60000       // Set starting money to $60000
mp_buytime 9999          // Set buy time to 9999 seconds 
mp_buy_anywhere 1        // Allow buying anywhere on the map
mp_freezetime 0          // Disable freeze time
mp_roundtime 60          // Set round time to 60 seconds
mp_roundtime_defuse 60    // Set round time for defuse maps to 60 seconds
mp_respawn_on_death_ct 1  // Enable instant respawn for CTs
mp_respawn_on_death_t 1  // Enable instant respawn for Ts
mp_tkpunish 0            // Disable teamkill punishment

// --- Visual Settings ---
sv_showimpacts 2          // Show bullet impacts (pink)
sv_showimpacts_time 10    // Display impacts for 10 seconds
inferno_flame_lifetime 3  // Set Molotov/Incendiary lifetime to 3 seconds

// --- Weapon Cleanup ---
weapon_auto_cleanup_time 10 // Clean up dropped weapons after 10 seconds
weapon_max_before_cleanup 5  // Maximum of 5 weapons on the ground

// --- Communication Settings ---
sv_deadtalk 1            // Allow dead players to talk
sv_full_alltalk 1        // Enable alltalk (everyone can hear each other)
sv_ignoregrenaderadio 1  // Disable grenade radio messages

// --- Miscellaneous ---
mp_warmup_end             // End warmup immediately
mp_teammates_are_enemies 1 // Make teammates act as enemies

// --- Screenshots mode, toggle on with 'o', toggle off with 'p' ---
bind o "toggle r_drawviewmodel 0; toggle cl_draw_only_deathnotices 1; toggle crosshair 0; toggle cl_hud_telemetry_net_quality_graph_show 0; toggle cl_hud_telemetry_net_misdelivery_show 0; toggle cl_hud_telemetry_ping_show 0; toggle r_show_build_info 0; cl_hud_telemetry_frametime_show 0"
bind p "toggle r_drawviewmodel 1; toggle cl_draw_only_deathnotices 0; toggle crosshair 1; toggle cl_hud_telemetry_net_quality_graph_show 2; toggle cl_hud_telemetry_net_misdelivery_show 2; toggle cl_hud_telemetry_ping_show 2; toggle r_show_build_info 1; cl_hud_telemetry_frametime_show 2"
